<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>CORE first floor — DECTA zones (schematic, not to scale)</title>
  <rect width="1200" height="600" fill="#ffffff"/>

  <text x="60" y="42" font-size="22" font-weight="600" fill="#1f2328">CORE first floor — DECTA zones</text>
  <text x="60" y="66" font-size="14" fill="#57606a">Schematic, not to scale. Door order and wall sides as reported 2026-09-29; exact positions are measured at G3 wiring.</text>

  <!-- +x wall label -->
  <text x="60" y="222" font-size="12" fill="#57606a">+x wall</text>
  <!-- -x wall label -->
  <text x="60" y="322" font-size="12" fill="#57606a">−x wall</text>

  <!-- Hallway (hub) -->
  <rect x="60" y="230" width="1080" height="80" fill="#eef3fb" stroke="#1f2328" stroke-width="3"/>
  <text x="600" y="266" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">hallway  ·  zone 0  ·  hub and reference frame</text>
  <text x="600" y="289" font-size="13" fill="#57606a" text-anchor="middle">captured, trained, integrated  ·  every transition is hallway ↔ room</text>
  <text x="1130" y="300" font-size="12" fill="#57606a" text-anchor="end">far end →</text>

  <!-- D1 printing room (−x wall, below hallway) -->
  <rect x="300" y="340" width="230" height="120" fill="#dcf2e3" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="415" y="390" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">printing-room</text>
  <text x="415" y="410" font-size="12" fill="#1a7f37" text-anchor="middle">zone 1 · captured · integrated</text>
  <line x1="380" y1="310" x2="440" y2="310" stroke="#ffffff" stroke-width="5"/>
  <line x1="380" y1="340" x2="440" y2="340" stroke="#ffffff" stroke-width="5"/>
  <rect x="380" y="310" width="60" height="30" fill="#eef3fb"/>
  <text x="410" y="330" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">D1</text>

  <!-- D2 machine shop (+x wall, slightly past printing room) -->
  <rect x="560" y="100" width="210" height="100" fill="#f6f8fa" stroke="#57606a" stroke-width="2.5"/>
  <text x="665" y="146" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">machine-shop</text>
  <text x="665" y="166" font-size="12" fill="#57606a" text-anchor="middle">zone 2 · not captured</text>
  <line x1="600" y1="230" x2="660" y2="230" stroke="#ffffff" stroke-width="5"/>
  <line x1="600" y1="200" x2="660" y2="200" stroke="#ffffff" stroke-width="5"/>
  <rect x="600" y="200" width="60" height="30" fill="#eef3fb"/>
  <text x="630" y="220" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">D2</text>

  <!-- D3 project studio (+x wall, at the end) -->
  <rect x="900" y="100" width="240" height="100" fill="#f6f8fa" stroke="#57606a" stroke-width="2.5"/>
  <text x="1020" y="146" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">project-studio</text>
  <text x="1020" y="166" font-size="12" fill="#57606a" text-anchor="middle">zone 3 · not captured</text>
  <line x1="1060" y1="230" x2="1120" y2="230" stroke="#ffffff" stroke-width="5"/>
  <line x1="1060" y1="200" x2="1120" y2="200" stroke="#ffffff" stroke-width="5"/>
  <rect x="1060" y="200" width="60" height="30" fill="#eef3fb"/>
  <text x="1090" y="220" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">D3</text>

  <!-- Legend / unplaced zone -->
  <line x1="60" y1="492" x2="1140" y2="492" stroke="#d0d7de" stroke-width="1"/>
  <rect x="60" y="510" width="26" height="16" fill="#dcf2e3" stroke="#1a7f37" stroke-width="2"/>
  <text x="94" y="523" font-size="13" fill="#1f2328">captured and in the app</text>
  <rect x="280" y="510" width="26" height="16" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="314" y="523" font-size="13" fill="#1f2328">planned, not captured</text>
  <text x="490" y="523" font-size="13" font-weight="700" fill="#cf222e">Dn</text>
  <text x="516" y="523" font-size="13" fill="#1f2328">doorway = transition; film it both directions</text>

  <rect x="60" y="545" width="26" height="16" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="94" y="558" font-size="13" fill="#1f2328"><tspan font-weight="600">computer-lab</tspan> · zone 4 · optional 5th zone, first cut (PLAN.md §7) · door D4 is on the +x wall; position along the hallway not yet recorded, so not drawn</text>
</svg>
